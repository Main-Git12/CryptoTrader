[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trader"
version = "0.1.0"
description = "Backtest/paper-trading crypto bot (live trading intentionally not wired up yet)"
requires-python = ">=3.11"
dependencies = ["ccxt>=4.3,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B027"]  # Strategy.reset is an intentionally optional no-op hook, not a missed abstractmethod

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "ccxt"
ignore_missing_imports = true
